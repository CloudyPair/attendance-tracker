name: flag

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: flag-journal:local
  env_file: .env
  environment:
    DJANGO_DB_BACKEND: postgres
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  volumes:
    - ./deploy/state/media:/app/media
    - ./deploy/state/static:/app/staticfiles
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flag}
      POSTGRES_USER: ${POSTGRES_USER:-flag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 deploy/configure.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    ports:
      - "127.0.0.1:${FLAG_HTTP_PORT:-18080}:8000"
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  bot:
    <<: *app
    profiles: [telegram]
    command: ["python", "manage.py", "runbot"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
