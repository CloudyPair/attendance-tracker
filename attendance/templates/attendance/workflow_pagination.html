{% if page_obj.has_other_pages %}<nav class="pagination" id="workflow-pagination" aria-label="Страницы">{% if page_obj.has_previous %}<a class="button secondary small" href="?page={{ page_obj.previous_page_number }}#workflow-pagination">Назад</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button secondary small" href="?page={{ page_obj.next_page_number }}#workflow-pagination">Далее</a>{% endif %}</nav>{% endif %}
